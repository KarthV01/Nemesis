<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nemesis Dashboard</title>
<meta name="description" content="Live commentator and evaluation metrics for Nemesis red-vs-blue self-play.">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<header>
  <h1>NEMESIS / DASHBOARD</h1>
  <span class="stat" id="status">feed <b>connecting</b></span>
  <span class="stat">episode <b id="episode">-</b></span>
  <span class="stat">step <b id="step">-</b></span>
  <span class="stat">events <b id="count">0</b></span>
  <span class="controls">
    <button id="pause" type="button">[pause]</button>
    <button id="clear" type="button">[clear]</button>
  </span>
</header>

<section id="arena" hidden aria-label="arena match controls">
  <form id="match-form">
    <label>red team<select id="red-team" name="red_team"></select></label>
    <label>red checkpoint<select id="red-checkpoint" name="red_checkpoint"><option value="">built-in policy</option></select></label>
    <label>blue team<select id="blue-team" name="blue_team"></select></label>
    <label>blue checkpoint<select id="blue-checkpoint" name="blue_checkpoint"><option value="">built-in policy</option></select></label>
    <label>scenario<select id="scenario" name="scenario"></select></label>
    <label>format<select id="match-format" name="format"></select></label>
    <label id="red-role-wrap" hidden>red role<select id="red-role" name="red_role"></select></label>
    <label id="blue-role-wrap" hidden>blue role<select id="blue-role" name="blue_role"></select></label>
    <label>steps<input id="steps" name="steps" type="number" min="1" max="500" value="100"></label>
    <label>seed<input id="seed" name="seed" type="number" placeholder="random"></label>
    <label>stream delay<input id="delay" name="delay" type="number" min="0" max="5" step="0.05" value="0.15"></label>
    <button class="primary" id="run-match" type="submit">RUN MATCH</button>
  </form>
  <div class="arena-foot">
    <span id="match-status">ready</span>
    <span id="match-result"></span>
    <span class="saved-label">saved replays</span>
    <span id="replays"></span>
  </div>
</section>

<!-- Evaluation KPIs: the metric vector, because win rate alone misleads. -->
<section id="kpis" aria-label="evaluation summary"></section>

<main>
  <!-- Left: the live commentator (terminal event feed). -->
  <section class="feed-panel" aria-label="event feed">
    <div class="panel-head">
      <span class="panel-title">EVENT FEED</span>
      <span class="legend" id="feed-legend"></span>
    </div>
    <div id="log" aria-live="polite"><div class="line" id="prompt"><span class="cursor"></span></div></div>
  </section>

  <!-- Right: evaluation metric time-series. -->
  <section class="charts-panel" aria-label="evaluation metrics">
    <div class="panel-head">
      <span class="panel-title">EVALUATION METRICS</span>
      <span class="panel-sub" id="metrics-sub">no metrics yet</span>
    </div>
    <div id="charts"></div>
  </section>
</main>

<script src="charts.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
